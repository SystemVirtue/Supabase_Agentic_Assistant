[project]
name = "agent-lifecycle-manager"
version = "0.1.0"
description = "Phase 4 Agent Lifecycle Manager for the Distributed Cognitive Agent - agent registry and goal management."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.6.0",
    "distributed-cognitive-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["agent_lifecycle_manager/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["agent_lifecycle_manager*"]
