[project]
name = "cognitive-engine"
version = "0.1.0"
description = "Phase 3 Cognitive Engine for the Distributed Cognitive Agent - Meta-Cognitive Controller, LangGraph integration, and memory tiering."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "litellm>=1.40.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.6.0",
    "distributed-cognitive-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["cognitive_engine/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["cognitive_engine*"]
