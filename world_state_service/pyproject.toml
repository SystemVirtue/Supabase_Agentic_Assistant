[project]
name = "world-state-service"
version = "0.1.0"
description = "Phase 2 World State Service for the Distributed Cognitive Agent - temporal conflict resolution and state management."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "nats-py>=2.9.0",
    "protobuf>=4.25.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.0.0",
    "distributed-cognitive-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["world_state_service/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["world_state_service*"]
